global:
  releaseVersion: 5.3.1
  operatorNamespace: cpd-operators
  instanceNamespace: cpd
  licensingNamespace: ibm-licensing
  opaGatewayName: ibm-software-hub
  blockStorageClass: ocs-storagecluster-ceph-rbd
  fileStorageClass: ocs-storagecluster-cephfs
  licenseType: Enterprise
  licenseAccept: true
  imagePullSecret: ibm-entitlement-key
  tetheredNamespaces: []
  imagePullSecrets:
    - ibm-entitlement-key
  components:
    - cpd_platform
    - cpfs
    - zen
    - watsonx_data
    - ws
    - ws_pipelines
    - ibm-licensing
    - scheduler
  storageClass: ocs-storagecluster-ceph-rbd
  scaleConfig: small
  cmPatchMetadata: 
  installConfigImageName: cpopen/cpd/olm-utils-v4
  installConfigImageTag: 5.3.1

cpd-platform:
  Chart:
    name: ibm-software-hub

postgresql:
  imagePullSecrets:
    - name: ibm-entitlement-key

ibm-common-service-operator:
  cpfs:
    imageRegistryNamespaceOperator: cpopen
    imageRegistryNamespaceOperand: cpopen/cpfs
    labels:
    # CR configurations
    size: small
    # Red Hat OCP authentication configuration
    roksEnabled: false

# -----------------------------------------------------------------------------
# zen.zen.ingressNodeHostname is intentionally left blank here.
# Each student sets their own cluster ingress hostname in their override file:
#   overrides/studentN/values.yaml
# Find the value with:
#   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
# -----------------------------------------------------------------------------
zen:
  zen:
    ingressNodeHostname: ""


ccs:
  ccs:
    scaleConfig: small
    cc_home_copy_options: -ru
    conn_home_copy_options: -ru

opencontent-opensearch:
  opencontentOpensearch:
    operatorImagePullPrefix: icr.io
    entitledImagePullPrefix: cp.icr.io


platform-config:
  applyEntitlement:
    - entitlement: watsonx-data
      production: true
    - entitlement: watsonx-ai
      production: false
